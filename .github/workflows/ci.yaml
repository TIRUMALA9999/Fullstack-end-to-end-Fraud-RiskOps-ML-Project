
name: FraudGuard CI

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fraudguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------------------
  # Job 1 — Code Quality
  # --------------------------------------------

  code-quality:
    name: Python Code Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install "ruff>=0.13,<1.0"

      - name: Check Python syntax
        run: |
          python -m compileall -q \
            apps/api apps/dashboard pipelines

      - name: Ruff critical checks
        run: |
          ruff check \
            --select E9,F63,F7,F82 \
            apps/api apps/dashboard pipelines


  # --------------------------------------------
  # Job 2 — Docker and Integration Testing
  # --------------------------------------------

  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # CI creates credentials for its own
      # disposable PostgreSQL and API environment.
      # No real application secrets are required.

      - name: Prepare CI environment
        shell: bash
        run: |
          mkdir -p \
            data/models/paysim/releases/lightgbm-shadow-v1

          echo "POSTGRES_USER=fraudguard_ci" >> "$GITHUB_ENV"
          echo "POSTGRES_DB=fraudguard_ci" >> "$GITHUB_ENV"

          DB_PASSWORD="$(openssl rand -hex 24)"
          API_KEY="$(openssl rand -hex 32)"

          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$API_KEY"

          echo "POSTGRES_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "FRAUDGUARD_SHADOW_API_KEY=$API_KEY" >> "$GITHUB_ENV"

      - name: Verify Docker and Compose
        run: |
          docker version
          docker compose version
          docker compose config --quiet

      # Build all three application images.
      # MLflow uses the pipeline image and does
      # not need a separate build for these checks.

      - name: Build Docker images
        run: |
          docker compose build api dashboard pipeline

      - name: Start test PostgreSQL
        run: |
          docker compose up -d --wait db

      - name: Apply Alembic migrations
        run: |
          docker compose run --rm api \
            alembic upgrade head

      - name: Verify Alembic revision and schema
        run: |
          docker compose run --rm api \
            alembic current

          docker compose run --rm api \
            alembic check

      # No PaySim raw dataset or trained model
      # is required for the automated unit tests.

      - name: Run FastAPI tests
        run: |
          docker compose run --rm api \
            python -m pytest -q

      - name: Run ML pipeline tests
        run: |
          docker compose --profile etl run --rm pipeline \
            python -m pytest -q

      - name: Run Streamlit dashboard tests
        run: |
          docker compose run --rm dashboard \
            python -m pytest -q

      # This checks startup without loading a
      # real model release or scoring transactions.

      - name: Start application containers
        run: |
          docker compose up -d --wait api dashboard

      - name: Smoke test FastAPI readiness
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/ready

      - name: Smoke test Streamlit health
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:8501/_stcore/health

      - name: Smoke test prediction history
        run: |
          curl --fail --silent --show-error \
            -H "X-Shadow-API-Key: $FRAUDGUARD_SHADOW_API_KEY" \
            "http://127.0.0.1:8000/shadow/predictions?limit=5" \
            | python3 -m json.tool

      - name: Smoke test shadow analytics
        run: |
          curl --fail --silent --show-error \
            -H "X-Shadow-API-Key: $FRAUDGUARD_SHADOW_API_KEY" \
            http://127.0.0.1:8000/shadow/summary \
            | python3 -m json.tool

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs \
            --no-color --tail=100 \
            db api dashboard

      - name: Clean up CI containers and volumes
        if: always()
        run: |
          docker compose down -v --remove-orphans
