name: fraudguard-riskops

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: ${POSTGRES_DB:?Required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build:
      context: ./apps/api

    restart: unless-stopped

    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: ${POSTGRES_DB:?Required}

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./apps/api:/app

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s


  dashboard:
    build:
      context: ./apps/dashboard

    restart: unless-stopped

    environment:
      API_BASE_URL: http://api:8000

    ports:
      - "127.0.0.1:8501:8501"

    volumes:
      - ./apps/dashboard:/app

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
  
  pipeline:
    build:
      context: ./pipelines

    profiles:
      - etl

    volumes:
      - ./data:/data

    working_dir: /app

    command:
      - python
      - ingest_paysim.py
      - --input
      - /data/raw/paysim/PS_20174392719_1491204439457_log.csv
      - --output
      - /data/processed/paysim/v1


volumes:
  postgres_data: